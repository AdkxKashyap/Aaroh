version: "3.9"

services:

  backend:
    build: .
    container_name: aaroh-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

    volumes:
      - .:/app

    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  postgres:
    image: postgres:17

    container_name: aaroh-postgres

    environment:
      POSTGRES_USER: aaroh_user
      POSTGRES_PASSWORD: aaroh123
      POSTGRES_DB: aaroh

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: